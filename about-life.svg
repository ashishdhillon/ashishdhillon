<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" fill="none">
  <defs>
    <linearGradient id="ab_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="ab_dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.2" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes ab_blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes ab_glowPulse {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 0.8; }
      }
      @keyframes ab_slide1 {
        0%, 30% { opacity: 1; transform: translateX(0); }
        33%, 97% { opacity: 0; transform: translateX(10px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes ab_slide2 {
        0%, 33% { opacity: 0; transform: translateX(-10px); }
        36%, 63% { opacity: 1; transform: translateX(0); }
        66%, 100% { opacity: 0; transform: translateX(10px); }
      }
      @keyframes ab_slide3 {
        0%, 66% { opacity: 0; transform: translateX(-10px); }
        70%, 97% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(10px); }
      }

      /* Story Progress Bars */
      @keyframes ab_bar1 {
        0% { width: 0px; }
        30%, 100% { width: 135px; }
      }
      @keyframes ab_bar2 {
        0%, 33% { width: 0px; }
        63%, 100% { width: 135px; }
      }
      @keyframes ab_bar3 {
        0%, 66% { width: 0px; }
        97%, 100% { width: 135px; }
      }

      .ab_cursor { animation: ab_blink 1s infinite; }
      .ab_glow { animation: ab_glowPulse 3s infinite ease-in-out; }
      .ab_s1 { animation: ab_slide1 12s infinite; }
      .ab_s2 { animation: ab_slide2 12s infinite; }
      .ab_s3 { animation: ab_slide3 12s infinite; }
      .ab_b1 { animation: ab_bar1 12s infinite linear; }
      .ab_b2 { animation: ab_bar2 12s infinite linear; }
      .ab_b3 { animation: ab_bar3 12s infinite linear; }
    </style>
  </defs>

  <!-- LEFT CARD: WHAT I BUILD (Width: 465, Height: 356) -->
  <g transform="translate(2, 2)">
    <!-- Background Card -->
    <rect width="465" height="356" rx="18" fill="#0B0D17" />
    <rect width="465" height="356" rx="18" fill="url(#ab_dotGrid)" />
    <rect width="465" height="356" rx="18" stroke="url(#ab_borderGrad)" stroke-width="1.2" />

    <!-- Browser Header Bar -->
    <path d="M 0 18 C 0 8, 8 0, 18 0 L 447 0 C 457 0, 465 8, 465 18 L 465 38 L 0 38 Z" fill="#0F1322" />
    <line x1="0" y1="38" x2="465" y2="38" stroke="#1E293B" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="18" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="32" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="46" cy="19" r="4.5" fill="#10B981" />

    <!-- URL Bar -->
    <rect x="65" y="8" width="280" height="22" rx="6" fill="#171F33" stroke="#1E293B" stroke-width="1" />
    <text x="75" y="23" fill="#64748B" class="mono" font-size="11">konoha://ashish/</text>
    <text x="180" y="23" fill="#22D3EE" class="mono" font-size="11">ninja-way</text>
    <rect x="250" y="12" width="1.5" height="13" fill="#22D3EE" class="ab_cursor" />

    <!-- Card Title -->
    <text x="24" y="66" fill="#FF7A00" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">// WHAT I BUILD (MY JUTSU)</text>

    <!-- Row 1: AI & LLM Guardrails -->
    <g transform="translate(20, 84)">
      <rect width="425" height="72" rx="12" fill="#101524" stroke="#1E293B" stroke-width="1" />
      <!-- Icon Box -->
      <rect x="12" y="12" width="48" height="48" rx="10" fill="#172036" stroke="#FF7A00" stroke-width="1" stroke-opacity="0.4" />
      <text x="26" y="42" font-size="22">🛡️</text>
      <!-- Texts -->
      <text x="70" y="32" fill="#F8FAFC" class="sans" font-size="14" font-weight="700">AI Guardrails &amp; Streaming Defense</text>
      <text x="70" y="50" fill="#94A3B8" class="sans" font-size="11.5">Zero-GPU reverse proxy, regex/entropy secret scrubber,</text>
      <text x="70" y="65" fill="#64748B" class="mono" font-size="10.5">LATENCY: &lt;5ms · ONNX · FASTAPI / TYPESCRIPT</text>
    </g>

    <!-- Row 2: Full-Stack Web & SaaS -->
    <g transform="translate(20, 168)">
      <rect width="425" height="72" rx="12" fill="#101524" stroke="#1E293B" stroke-width="1" />
      <!-- Icon Box -->
      <rect x="12" y="12" width="48" height="48" rx="10" fill="#172036" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4" />
      <text x="26" y="42" font-size="22">⚡</text>
      <!-- Texts -->
      <text x="70" y="32" fill="#F8FAFC" class="sans" font-size="14" font-weight="700">Full-Stack Cloud Platforms</text>
      <text x="70" y="50" fill="#94A3B8" class="sans" font-size="11.5">Night Owl Labs: Next.js 15, TypeScript, Tailwind CSS,</text>
      <text x="70" y="65" fill="#64748B" class="mono" font-size="10.5">SUPABASE POSTGRESQL · SHADCN UI · VERCEL</text>
    </g>

    <!-- Row 3: Cybersecurity & Systems -->
    <g transform="translate(20, 252)">
      <rect width="425" height="72" rx="12" fill="#101524" stroke="#1E293B" stroke-width="1" />
      <!-- Icon Box -->
      <rect x="12" y="12" width="48" height="48" rx="10" fill="#172036" stroke="#A855F7" stroke-width="1" stroke-opacity="0.4" />
      <text x="26" y="42" font-size="22">🔒</text>
      <!-- Texts -->
      <text x="70" y="32" fill="#F8FAFC" class="sans" font-size="14" font-weight="700">Cybersecurity &amp; Runtime Hardening</text>
      <text x="70" y="50" fill="#94A3B8" class="sans" font-size="11.5">Model threat analysis, secure Docker runtimes, zero-trust,</text>
      <text x="70" y="65" fill="#64748B" class="mono" font-size="10.5">DOCKER · LINUX · SYSTEM MONITORING</text>
    </g>
  </g>

  <!-- RIGHT CARD: HOBBIES & CHAKRA (Width: 465, Height: 356) -->
  <g transform="translate(491, 2)">
    <!-- Background Card -->
    <rect width="465" height="356" rx="18" fill="#0B0D17" />
    <rect width="465" height="356" rx="18" fill="url(#ab_dotGrid)" />
    <rect width="465" height="356" rx="18" stroke="url(#ab_borderGrad)" stroke-width="1.2" />

    <!-- Card Header / Title -->
    <text x="24" y="30" fill="#22D3EE" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">// CHAKRA DISCIPLINES &amp; PASSIONS</text>
    
    <!-- Story Segment Progress Bars (3 Bars) -->
    <g transform="translate(24, 42)">
      <!-- Track 1 -->
      <rect x="0" y="0" width="135" height="4" rx="2" fill="#1E293B" />
      <rect x="0" y="0" width="135" height="4" rx="2" fill="#FF7A00" class="ab_b1" />
      
      <!-- Track 2 -->
      <rect x="142" y="0" width="135" height="4" rx="2" fill="#1E293B" />
      <rect x="142" y="0" width="135" height="4" rx="2" fill="#22D3EE" class="ab_b2" />
      
      <!-- Track 3 -->
      <rect x="284" y="0" width="135" height="4" rx="2" fill="#1E293B" />
      <rect x="284" y="0" width="135" height="4" rx="2" fill="#A855F7" class="ab_b3" />
    </g>

    <!-- Carousel Content Box -->
    <g transform="translate(24, 62)">
      <rect width="417" height="150" rx="14" fill="#101524" stroke="#1E293B" stroke-width="1" />

      <!-- Slide 1: Open Source & Code -->
      <g class="ab_s1" transform="translate(18, 22)">
        <text x="0" y="16" fill="#FF7A00" class="mono" font-size="11" font-weight="700">CHAKRA DISCIPLINE [01 / 03]</text>
        <text x="0" y="42" fill="#FFFFFF" class="sans" font-size="18" font-weight="700">💻 Open-Source &amp; System Craftsmanship</text>
        <text x="0" y="68" fill="#94A3B8" class="sans" font-size="13">
          <tspan x="0" dy="0">Writing elegant code, crafting autonomous agent tools,</tspan>
          <tspan x="0" dy="20">and optimizing performance down to the byte on macOS.</tspan>
        </text>
        <rect x="0" y="98" width="110" height="22" rx="6" fill="#1E293B" />
        <text x="10" y="113" fill="#FDBA74" class="mono" font-size="10">TAI-JUTSU (CODE)</text>
      </g>

      <!-- Slide 2: AI Safety & R&D -->
      <g class="ab_s2" transform="translate(18, 22)">
        <text x="0" y="16" fill="#22D3EE" class="mono" font-size="11" font-weight="700">CHAKRA DISCIPLINE [02 / 03]</text>
        <text x="0" y="42" fill="#FFFFFF" class="sans" font-size="18" font-weight="700">🧠 AI Safety &amp; Guardrail Research</text>
        <text x="0" y="68" fill="#94A3B8" class="sans" font-size="13">
          <tspan x="0" dy="0">Exploring prompt injection mitigations, reverse proxy</tspan>
          <tspan x="0" dy="20">streaming defenses, and real-time LLM security architectures.</tspan>
        </text>
        <rect x="0" y="98" width="130" height="22" rx="6" fill="#1E293B" />
        <text x="10" y="113" fill="#67E8F9" class="mono" font-size="10">NIN-JUTSU (AI DEFENSE)</text>
      </g>

      <!-- Slide 3: Anime, Gaming & Growth -->
      <g class="ab_s3" transform="translate(18, 22)">
        <text x="0" y="16" fill="#A855F7" class="mono" font-size="11" font-weight="700">CHAKRA DISCIPLINE [03 / 03]</text>
        <text x="0" y="42" fill="#FFFFFF" class="sans" font-size="18" font-weight="700">🍥 Anime, Gaming &amp; Fitness</text>
        <text x="0" y="68" fill="#94A3B8" class="sans" font-size="13">
          <tspan x="0" dy="0">Drawing energy from Naruto &amp; Shonen anime, gaming,</tspan>
          <tspan x="0" dy="20">staying active with workouts, and continuous learning.</tspan>
        </text>
        <rect x="0" y="98" width="125" height="22" rx="6" fill="#1E293B" />
        <text x="10" y="113" fill="#D8B4FE" class="mono" font-size="10">GEN-JUTSU (CREATIVE)</text>
      </g>
    </g>

    <!-- Three Daily Chakra Rings (Bottom) -->
    <g transform="translate(24, 230)">
      <text x="0" y="12" fill="#64748B" class="mono" font-size="11" font-weight="600">DAILY CHAKRA POOLS (HOURLY SYNC):</text>

      <!-- Ring 1: Code Chakra (Orange) -->
      <g transform="translate(25, 60)">
        <circle cx="28" cy="28" r="24" stroke="#1E293B" stroke-width="4.5" fill="none" />
        <circle cx="28" cy="28" r="24" stroke="#FF7A00" stroke-width="4.5" fill="none" stroke-dasharray="150" stroke-dashoffset="15" stroke-linecap="round" transform="rotate(-90 28 28)">
          <animate attributeName="stroke-dashoffset" values="150; 15" dur="2s" fill="freeze" />
        </circle>
        <text x="28" y="32" text-anchor="middle" fill="#FFFFFF" class="mono" font-size="11" font-weight="700">96%</text>
        <text x="28" y="70" text-anchor="middle" fill="#94A3B8" class="sans" font-size="11" font-weight="600">Code</text>
      </g>

      <!-- Ring 2: AI Security (Cyan) -->
      <g transform="translate(165, 60)">
        <circle cx="28" cy="28" r="24" stroke="#1E293B" stroke-width="4.5" fill="none" />
        <circle cx="28" cy="28" r="24" stroke="#22D3EE" stroke-width="4.5" fill="none" stroke-dasharray="150" stroke-dashoffset="25" stroke-linecap="round" transform="rotate(-90 28 28)">
          <animate attributeName="stroke-dashoffset" values="150; 25" dur="2s" fill="freeze" />
        </circle>
        <text x="28" y="32" text-anchor="middle" fill="#FFFFFF" class="mono" font-size="11" font-weight="700">92%</text>
        <text x="28" y="70" text-anchor="middle" fill="#94A3B8" class="sans" font-size="11" font-weight="600">AI Defense</text>
      </g>

      <!-- Ring 3: System Ops (Violet) -->
      <g transform="translate(305, 60)">
        <circle cx="28" cy="28" r="24" stroke="#1E293B" stroke-width="4.5" fill="none" />
        <circle cx="28" cy="28" r="24" stroke="#A855F7" stroke-width="4.5" fill="none" stroke-dasharray="150" stroke-dashoffset="35" stroke-linecap="round" transform="rotate(-90 28 28)">
          <animate attributeName="stroke-dashoffset" values="150; 35" dur="2s" fill="freeze" />
        </circle>
        <text x="28" y="32" text-anchor="middle" fill="#FFFFFF" class="mono" font-size="11" font-weight="700">88%</text>
        <text x="28" y="70" text-anchor="middle" fill="#94A3B8" class="sans" font-size="11" font-weight="600">System Ops</text>
      </g>
    </g>
  </g>
</svg>
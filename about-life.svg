<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" fill="none">
  <defs>
    <linearGradient id="ab_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.7" />
    </linearGradient>

    <pattern id="ab_dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.25" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes ab_blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes ab_slide1 {
        0%, 30% { opacity: 1; transform: translateX(0); }
        33%, 97% { opacity: 0; transform: translateX(10px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes ab_slide2 {
        0%, 33% { opacity: 0; transform: translateX(-10px); }
        36%, 63% { opacity: 1; transform: translateX(0); }
        66%, 100% { opacity: 0; transform: translateX(10px); }
      }
      @keyframes ab_slide3 {
        0%, 66% { opacity: 0; transform: translateX(-10px); }
        70%, 97% { opacity: 1; transform: translateX(0); }
        100% { opacity: 0; transform: translateX(10px); }
      }

      /* Story Progress Bars */
      @keyframes ab_bar1 {
        0% { width: 0px; }
        30%, 100% { width: 135px; }
      }
      @keyframes ab_bar2 {
        0%, 33% { width: 0px; }
        63%, 100% { width: 135px; }
      }
      @keyframes ab_bar3 {
        0%, 66% { width: 0px; }
        97%, 100% { width: 135px; }
      }

      .ab_cursor { animation: ab_blink 1s infinite; }
      .ab_s1 { animation: ab_slide1 12s infinite; }
      .ab_s2 { animation: ab_slide2 12s infinite; }
      .ab_s3 { animation: ab_slide3 12s infinite; }
      .ab_b1 { animation: ab_bar1 12s infinite linear; }
      .ab_b2 { animation: ab_bar2 12s infinite linear; }
      .ab_b3 { animation: ab_bar3 12s infinite linear; }
    </style>
  </defs>

  <!-- LEFT CARD: WHAT I BUILD -->
  <g transform="translate(2, 2)">
    <rect width="465" height="356" rx="18" fill="#F8FAF9" />
    <rect width="465" height="356" rx="18" fill="url(#ab_dotGrid)" />
    <rect width="465" height="356" rx="18" stroke="url(#ab_borderGrad)" stroke-width="1.6" />

    <!-- Browser Header Bar -->
    <path d="M 0 18 C 0 8, 8 0, 18 0 L 447 0 C 457 0, 465 8, 465 18 L 465 38 L 0 38 Z" fill="#E8EFEA" />
    <line x1="0" y1="38" x2="465" y2="38" stroke="#CBD5E1" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="18" cy="19" r="4.5" fill="#EF4444" />
    <circle cx="32" cy="19" r="4.5" fill="#F59E0B" />
    <circle cx="46" cy="19" r="4.5" fill="#10B981" />

    <!-- URL Bar -->
    <rect x="65" y="8" width="280" height="22" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="75" y="23" fill="#64748B" class="mono" font-size="11">konoha://ashish/</text>
    <text x="180" y="23" fill="#047857" class="mono" font-size="11" font-weight="700">ninja-way</text>
    <rect x="250" y="12" width="1.5" height="13" fill="#059669" class="ab_cursor" />

    <!-- Card Title -->
    <text x="24" y="66" fill="#047857" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">// WHAT I BUILD (MY JUTSU)</text>

    <!-- Row 1: guardkit & AI Guardrails -->
    <g transform="translate(20, 84)">
      <rect width="425" height="72" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" stroke-opacity="0.3" />
      <rect x="12" y="12" width="48" height="48" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
      <text x="26" y="42" font-size="22">🛡️</text>
      <text x="70" y="32" fill="#0F172A" class="sans" font-size="14" font-weight="700">guardkit: Offline Deterministic LLM Guards</text>
      <text x="70" y="50" fill="#334155" class="sans" font-size="11.5">PII (Luhn/Verhoeff), secrets, prompt injection &amp; JSON check,</text>
      <text x="70" y="65" fill="#047857" class="mono" font-size="10.5" font-weight="600">ZERO NETWORK CALLS · PYPI/PYTHON · PYRAML ONLY</text>
    </g>

    <!-- Row 2: bharatid & injection-bench -->
    <g transform="translate(20, 168)">
      <rect width="425" height="72" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.2" stroke-opacity="0.3" />
      <rect x="12" y="12" width="48" height="48" rx="10" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1" />
      <text x="26" y="42" font-size="22">🇮🇳</text>
      <text x="70" y="32" fill="#0F172A" class="sans" font-size="14" font-weight="700">bharatid &amp; injection-bench</text>
      <text x="70" y="50" fill="#334155" class="sans" font-size="11.5">Aadhaar/GSTIN/PAN/UPI scrubber &amp; leakage-free eval harness,</text>
      <text x="70" y="65" fill="#0F766E" class="mono" font-size="10.5" font-weight="600">VERHOEFF CHECKSUM · BASE-36 · TIME-SPLIT BENCHMARK</text>
    </g>

    <!-- Row 3: Night Owl Labs -->
    <g transform="translate(20, 252)">
      <rect width="425" height="72" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" stroke-opacity="0.3" />
      <rect x="12" y="12" width="48" height="48" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1" />
      <text x="26" y="42" font-size="22">⚡</text>
      <text x="70" y="32" fill="#0F172A" class="sans" font-size="14" font-weight="700">Night Owl Labs: Student Career Web</text>
      <text x="70" y="50" fill="#334155" class="sans" font-size="11.5">Learn → Build → Scale platform: Next.js 15, TypeScript,</text>
      <text x="70" y="65" fill="#B45309" class="mono" font-size="10.5" font-weight="600">SUPABASE POSTGRESQL · SHADCN UI · VERCEL</text>
    </g>
  </g>

  <!-- RIGHT CARD: HOBBIES & CHAKRA -->
  <g transform="translate(491, 2)">
    <rect width="465" height="356" rx="18" fill="#F8FAF9" />
    <rect width="465" height="356" rx="18" fill="url(#ab_dotGrid)" />
    <rect width="465" height="356" rx="18" stroke="url(#ab_borderGrad)" stroke-width="1.6" />

    <text x="24" y="30" fill="#047857" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">// CHAKRA DISCIPLINES &amp; PASSIONS</text>
    
    <g transform="translate(24, 42)">
      <rect x="0" y="0" width="135" height="4" rx="2" fill="#E2E8F0" />
      <rect x="0" y="0" width="135" height="4" rx="2" fill="#059669" class="ab_b1" />
      
      <rect x="142" y="0" width="135" height="4" rx="2" fill="#E2E8F0" />
      <rect x="142" y="0" width="135" height="4" rx="2" fill="#0D9488" class="ab_b2" />
      
      <rect x="284" y="0" width="135" height="4" rx="2" fill="#E2E8F0" />
      <rect x="284" y="0" width="135" height="4" rx="2" fill="#D97706" class="ab_b3" />
    </g>

    <g transform="translate(24, 62)">
      <rect width="417" height="150" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

      <!-- Slide 1: guardkit & AI Guardrails -->
      <g class="ab_s1" transform="translate(18, 22)">
        <text x="0" y="16" fill="#059669" class="mono" font-size="11" font-weight="700">CHAKRA DISCIPLINE [01 / 03]</text>
        <text x="0" y="42" fill="#0F172A" class="sans" font-size="18" font-weight="700">🛡️ AI Guardrails &amp; Fūinjutsu (Seals)</text>
        <text x="0" y="68" fill="#334155" class="sans" font-size="13">
          <tspan x="0" dy="0">Building deterministic guardrails (guardkit), Verhoeff</tspan>
          <tspan x="0" dy="20">checksum PII scrubbers (bharatid), and leak-free evals.</tspan>
        </text>
        <rect x="0" y="98" width="145" height="22" rx="6" fill="#ECFDF5" />
        <text x="10" y="113" fill="#047857" class="mono" font-size="10" font-weight="700">GUARDKIT · BHARATID</text>
      </g>

      <!-- Slide 2: Full-Stack Engineering -->
      <g class="ab_s2" transform="translate(18, 22)">
        <text x="0" y="16" fill="#0D9488" class="mono" font-size="11" font-weight="700">CHAKRA DISCIPLINE [02 / 03]</text>
        <text x="0" y="42" fill="#0F172A" class="sans" font-size="18" font-weight="700">⚡ Full-Stack Platforms &amp; Architecture</text>
        <text x="0" y="68" fill="#334155" class="sans" font-size="13">
          <tspan x="0" dy="0">Architecting Night Owl Labs with Next.js 15, TypeScript,</tspan>
          <tspan x="0" dy="20">Tailwind CSS, and Supabase PostgreSQL with auth &amp; storage.</tspan>
        </text>
        <rect x="0" y="98" width="155" height="22" rx="6" fill="#F0FDFA" />
        <text x="10" y="113" fill="#0F766E" class="mono" font-size="10" font-weight="700">NIGHT OWL LABS (V1)</text>
      </g>

      <!-- Slide 3: System Optimization & Anime -->
      <g class="ab_s3" transform="translate(18, 22)">
        <text x="0" y="16" fill="#D97706" class="mono" font-size="11" font-weight="700">CHAKRA DISCIPLINE [03 / 03]</text>
        <text x="0" y="42" fill="#0F172A" class="sans" font-size="18" font-weight="700">🍥 System Craftsmanship &amp; Anime</text>
        <text x="0" y="68" fill="#334155" class="sans" font-size="13">
          <tspan x="0" dy="0">Drawing energy from Naruto &amp; Shonen anime, autonomous</tspan>
          <tspan x="0" dy="20">Mac optimizations, active fitness, and continuous R&amp;D.</tspan>
        </text>
        <rect x="0" y="98" width="140" height="22" rx="6" fill="#FFFBEB" />
        <text x="10" y="113" fill="#B45309" class="mono" font-size="10" font-weight="700">SHINOBI PHILOSOPHY</text>
      </g>
    </g>

    <!-- Three Daily Chakra Rings -->
    <g transform="translate(24, 230)">
      <text x="0" y="12" fill="#64748B" class="mono" font-size="11" font-weight="700">DAILY CHAKRA POOLS (HOURLY SYNC):</text>

      <g transform="translate(25, 38)">
        <circle cx="28" cy="28" r="24" stroke="#E2E8F0" stroke-width="4.5" fill="none" />
        <circle cx="28" cy="28" r="24" stroke="#059669" stroke-width="4.5" fill="none" stroke-dasharray="150" stroke-dashoffset="15" stroke-linecap="round" transform="rotate(-90 28 28)">
          <animate attributeName="stroke-dashoffset" values="150; 15" dur="2s" fill="freeze" />
        </circle>
        <text x="28" y="32" text-anchor="middle" fill="#0F172A" class="mono" font-size="11" font-weight="700">96%</text>
        <text x="28" y="70" text-anchor="middle" fill="#047857" class="sans" font-size="11" font-weight="700">AI Guards</text>
      </g>

      <g transform="translate(165, 38)">
        <circle cx="28" cy="28" r="24" stroke="#E2E8F0" stroke-width="4.5" fill="none" />
        <circle cx="28" cy="28" r="24" stroke="#0D9488" stroke-width="4.5" fill="none" stroke-dasharray="150" stroke-dashoffset="25" stroke-linecap="round" transform="rotate(-90 28 28)">
          <animate attributeName="stroke-dashoffset" values="150; 25" dur="2s" fill="freeze" />
        </circle>
        <text x="28" y="32" text-anchor="middle" fill="#0F172A" class="mono" font-size="11" font-weight="700">94%</text>
        <text x="28" y="70" text-anchor="middle" fill="#0F766E" class="sans" font-size="11" font-weight="700">Full-Stack</text>
      </g>

      <g transform="translate(305, 38)">
        <circle cx="28" cy="28" r="24" stroke="#E2E8F0" stroke-width="4.5" fill="none" />
        <circle cx="28" cy="28" r="24" stroke="#D97706" stroke-width="4.5" fill="none" stroke-dasharray="150" stroke-dashoffset="35" stroke-linecap="round" transform="rotate(-90 28 28)">
          <animate attributeName="stroke-dashoffset" values="150; 35" dur="2s" fill="freeze" />
        </circle>
        <text x="28" y="32" text-anchor="middle" fill="#0F172A" class="mono" font-size="11" font-weight="700">89%</text>
        <text x="28" y="70" text-anchor="middle" fill="#B45309" class="sans" font-size="11" font-weight="700">Evaluations</text>
      </g>
    </g>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" fill="none">
  <defs>
    <radialGradient id="st_coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F8FAF9" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="st_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.7" />
    </linearGradient>

    <pattern id="st_dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.25" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes st_pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes st_chipGlow1 {
        0%, 25% { stroke: #059669; stroke-width: 1.8; stroke-opacity: 1; }
        30%, 100% { stroke: #E2E8F0; stroke-width: 1.2; stroke-opacity: 0.8; }
      }
      @keyframes st_chipGlow2 {
        0%, 25% { stroke: #E2E8F0; stroke-width: 1.2; stroke-opacity: 0.8; }
        26%, 50% { stroke: #0D9488; stroke-width: 1.8; stroke-opacity: 1; }
        55%, 100% { stroke: #E2E8F0; stroke-width: 1.2; stroke-opacity: 0.8; }
      }
      @keyframes st_chipGlow3 {
        0%, 50% { stroke: #E2E8F0; stroke-width: 1.2; stroke-opacity: 0.8; }
        51%, 75% { stroke: #D97706; stroke-width: 1.8; stroke-opacity: 1; }
        80%, 100% { stroke: #E2E8F0; stroke-width: 1.2; stroke-opacity: 0.8; }
      }
      @keyframes st_chipGlow4 {
        0%, 75% { stroke: #E2E8F0; stroke-width: 1.2; stroke-opacity: 0.8; }
        76%, 100% { stroke: #DC2626; stroke-width: 1.8; stroke-opacity: 1; }
      }

      .st_core { animation: st_pulseGlow 3s infinite ease-in-out; }
      .st_cg1 { animation: st_chipGlow1 8s infinite; }
      .st_cg2 { animation: st_chipGlow2 8s infinite; }
      .st_cg3 { animation: st_chipGlow3 8s infinite; }
      .st_cg4 { animation: st_chipGlow4 8s infinite; }
    </style>
  </defs>

  <!-- Main Background Container (Light Leaf Parchment) -->
  <rect x="2" y="2" width="956" height="416" rx="20" fill="#F8FAF9" />
  <rect x="2" y="2" width="956" height="416" rx="20" fill="url(#st_dotGrid)" />
  <rect x="2" y="2" width="956" height="416" rx="20" stroke="url(#st_borderGrad)" stroke-width="1.6" />

  <!-- Card Header -->
  <g transform="translate(35, 30)">
    <text x="0" y="0" fill="#047857" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">// CHAKRA MATRIX // ARSENAL OF JUTSU</text>
    <text x="0" y="22" fill="#0F172A" class="sans" font-size="20" font-weight="800">Orbiting Tech Universe &amp; Weaponry</text>
  </g>

  <!-- LEFT: 3 TILTED ELLIPTICAL ORBITS AROUND KONOHA RASENGAN CORE -->
  <g transform="translate(230, 246) scale(0.8)">
    <circle cx="0" cy="0" r="140" fill="url(#st_coreGlow)" />

    <!-- ORBIT 1: Tilted -30 deg (Leaf Green - Frontend/Next.js) -->
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="190" ry="70" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4" fill="none" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
        <g transform="translate(190, 0)">
          <g transform="rotate(30)"><g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#3178C6" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#1D4ED8" class="mono" font-size="10" font-weight="700">TS</text></g></g>
        </g>
        <g transform="translate(-190, 0)">
          <g transform="rotate(30)"><g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#0F172A" class="mono" font-size="9" font-weight="700">Next</text></g></g>
        </g>
      </g>
    </g>

    <!-- ORBIT 2: Tilted 30 deg (Amber/Orange - Python/AI Guardrails) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="180" ry="75" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4" fill="none" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite" />
        <g transform="translate(180, 0)">
          <g transform="rotate(-30)"><g>
            <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="16s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#B45309" class="mono" font-size="10" font-weight="700">Py</text></g></g>
        </g>
        <g transform="translate(-180, 0)">
          <g transform="rotate(-30)"><g>
            <animateTransform attributeName="transform" type="rotate" from="-360" to="0" dur="16s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#047857" class="mono" font-size="8" font-weight="700">Supa</text></g></g>
        </g>
      </g>
    </g>

    <!-- ORBIT 3: Horizontal 85 deg (Crimson - Docker/Cybersecurity) -->
    <g transform="rotate(85)">
      <ellipse cx="0" cy="0" rx="170" ry="60" stroke="#DC2626" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4" fill="none" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
        <g transform="translate(170, 0)">
          <g transform="rotate(-85)"><g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#1D4ED8" class="mono" font-size="8" font-weight="700">Dock</text></g></g>
        </g>
        <g transform="translate(-170, 0)">
          <g transform="rotate(-85)"><g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#B91C1C" class="mono" font-size="8" font-weight="700">Sec</text></g></g>
        </g>
      </g>
    </g>

    <!-- CENTRAL KONOHA CHAKRA CORE -->
    <g class="st_core">
      <circle cx="0" cy="0" r="28" fill="#10B981" fill-opacity="0.9" />
      <circle cx="0" cy="0" r="21" fill="#FFFFFF" />
      <g transform="scale(0.04) translate(-256, -256)" fill="#DC2626">
        <path d="M256,48C141.1,48,48,141.1,48,256s93.1,208,208,208s208-93.1,208-208S370.9,48,256,48z M256,424 c-92.6,0-168-75.4-168-168c0-44.5,17.3-85,45.7-115.1l32.5,32.5C148.6,192.5,138,223,138,256c0,65.1,52.9,118,118,118 s118-52.9,118-118c0-38.6-18.7-72.9-47.5-94.4l28.8-35.8C391.8,155.6,414,203.2,414,256C414,348.6,338.6,424,256,424z" />
      </g>
    </g>
  </g>

  <!-- RIGHT: GROUPED CHIP GRID (Sequential Glow on White Cards) -->
  <g transform="translate(480, 80)">
    
    <!-- Group 1: Languages -->
    <g transform="translate(0, 0)">
      <rect width="440" height="66" rx="12" fill="#FFFFFF" class="st_cg1" />
      <text x="16" y="22" fill="#047857" class="mono" font-size="11" font-weight="700">LANGUAGES (CHAKRA ROOTS)</text>
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="82" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="41" y="16" text-anchor="middle" fill="#1D4ED8" class="mono" font-size="10" font-weight="700">TypeScript</text>
        <rect x="90" y="0" width="82" height="24" rx="6" fill="#FEFCE8" stroke="#FEF08A" stroke-width="1" />
        <text x="131" y="16" text-anchor="middle" fill="#A16207" class="mono" font-size="10" font-weight="700">JavaScript</text>
        <rect x="180" y="0" width="57" height="24" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
        <text x="208.5" y="16" text-anchor="middle" fill="#15803D" class="mono" font-size="10" font-weight="700">Python</text>
        <rect x="245" y="0" width="39" height="24" rx="6" fill="#FDF4FF" stroke="#F5D0FE" stroke-width="1" />
        <text x="264.5" y="16" text-anchor="middle" fill="#7E22CE" class="mono" font-size="10" font-weight="700">SQL</text>
        <rect x="292" y="0" width="70" height="24" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
        <text x="327" y="16" text-anchor="middle" fill="#B91C1C" class="mono" font-size="10" font-weight="700">HTML/CSS</text>
      </g>
    </g>

    <!-- Group 2: Frontend & UI -->
    <g transform="translate(0, 78)">
      <rect width="440" height="66" rx="12" fill="#FFFFFF" class="st_cg2" />
      <text x="16" y="22" fill="#0D9488" class="mono" font-size="11" font-weight="700">FRONTEND &amp; UI (GEN-JUTSU)</text>
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="70" height="24" rx="6" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
        <text x="35" y="16" text-anchor="middle" fill="#0F766E" class="mono" font-size="10" font-weight="700">React 19</text>
        <rect x="78" y="0" width="82" height="24" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="119" y="16" text-anchor="middle" fill="#0F172A" class="mono" font-size="10" font-weight="700">Next.js 15</text>
        <rect x="168" y="0" width="94" height="24" rx="6" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1" />
        <text x="215" y="16" text-anchor="middle" fill="#0F766E" class="mono" font-size="10" font-weight="700">Tailwind CSS</text>
        <rect x="270" y="0" width="45" height="24" rx="6" fill="#FAF5FF" stroke="#E9D5FF" stroke-width="1" />
        <text x="292.5" y="16" text-anchor="middle" fill="#6B21A8" class="mono" font-size="10" font-weight="700">Vite</text>
        <rect x="323" y="0" width="76" height="24" rx="6" fill="#FDF4FF" stroke="#F0ABFC" stroke-width="1" />
        <text x="361" y="16" text-anchor="middle" fill="#86198F" class="mono" font-size="10" font-weight="700">shadcn/ui</text>
      </g>
    </g>

    <!-- Group 3: Backend & Databases -->
    <g transform="translate(0, 156)">
      <rect width="440" height="66" rx="12" fill="#FFFFFF" class="st_cg3" />
      <text x="16" y="22" fill="#D97706" class="mono" font-size="11" font-weight="700">BACKEND &amp; CLOUD (TAI-JUTSU)</text>
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="63" height="24" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1" />
        <text x="31.5" y="16" text-anchor="middle" fill="#15803D" class="mono" font-size="10" font-weight="700">Node.js</text>
        <rect x="71" y="0" width="70" height="24" rx="6" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
        <text x="106" y="16" text-anchor="middle" fill="#047857" class="mono" font-size="10" font-weight="700">Supabase</text>
        <rect x="149" y="0" width="82" height="24" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1" />
        <text x="190" y="16" text-anchor="middle" fill="#1E40AF" class="mono" font-size="10" font-weight="700">PostgreSQL</text>
        <rect x="239" y="0" width="63" height="24" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="270.5" y="16" text-anchor="middle" fill="#1E293B" class="mono" font-size="10" font-weight="700">Express</text>
        <rect x="310" y="0" width="57" height="24" rx="6" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1" />
        <text x="338.5" y="16" text-anchor="middle" fill="#0369A1" class="mono" font-size="10" font-weight="700">Docker</text>
      </g>
    </g>

    <!-- Group 4: AI & Security -->
    <g transform="translate(0, 234)">
      <rect width="440" height="66" rx="12" fill="#FFFFFF" class="st_cg4" />
      <text x="16" y="22" fill="#DC2626" class="mono" font-size="11" font-weight="700">AI SAFETY &amp; GUARDS (SEAL JUTSU / FŪINJUTSU)</text>
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="107" height="24" rx="6" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1" />
        <text x="53.5" y="16" text-anchor="middle" fill="#047857" class="mono" font-size="10" font-weight="700">LLM Guardrails</text>
        <rect x="115" y="0" width="94" height="24" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" />
        <text x="162" y="16" text-anchor="middle" fill="#B45309" class="mono" font-size="10" font-weight="700">ONNX Runtime</text>
        <rect x="217" y="0" width="113" height="24" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" />
        <text x="273.5" y="16" text-anchor="middle" fill="#B91C1C" class="mono" font-size="10" font-weight="700">Secret Scrubber</text>
        <rect x="338" y="0" width="63" height="24" rx="6" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1" />
        <text x="369.5" y="16" text-anchor="middle" fill="#5B21B6" class="mono" font-size="10" font-weight="700">FastAPI</text>
      </g>
    </g>

  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" fill="none">
  <defs>
    <radialGradient id="st_coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#FF7A00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0B0D17" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="st_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.7" />
    </linearGradient>

    <pattern id="st_dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.2" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes st_spinCore {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes st_pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes st_chipGlow1 {
        0%, 25% { stroke: #FF7A00; stroke-width: 1.5; stroke-opacity: 1; }
        30%, 100% { stroke: #1E293B; stroke-width: 1; stroke-opacity: 0.8; }
      }
      @keyframes st_chipGlow2 {
        0%, 25% { stroke: #1E293B; stroke-width: 1; stroke-opacity: 0.8; }
        26%, 50% { stroke: #22D3EE; stroke-width: 1.5; stroke-opacity: 1; }
        55%, 100% { stroke: #1E293B; stroke-width: 1; stroke-opacity: 0.8; }
      }
      @keyframes st_chipGlow3 {
        0%, 50% { stroke: #1E293B; stroke-width: 1; stroke-opacity: 0.8; }
        51%, 75% { stroke: #A855F7; stroke-width: 1.5; stroke-opacity: 1; }
        80%, 100% { stroke: #1E293B; stroke-width: 1; stroke-opacity: 0.8; }
      }
      @keyframes st_chipGlow4 {
        0%, 75% { stroke: #1E293B; stroke-width: 1; stroke-opacity: 0.8; }
        76%, 100% { stroke: #10B981; stroke-width: 1.5; stroke-opacity: 1; }
      }

      .st_core { animation: st_pulseGlow 3s infinite ease-in-out; }
      .st_rotate { animation: st_spinCore 20s infinite linear; }
      .st_cg1 { animation: st_chipGlow1 8s infinite; }
      .st_cg2 { animation: st_chipGlow2 8s infinite; }
      .st_cg3 { animation: st_chipGlow3 8s infinite; }
      .st_cg4 { animation: st_chipGlow4 8s infinite; }
    </style>
  </defs>

  <!-- Main Background Container -->
  <rect x="2" y="2" width="956" height="416" rx="20" fill="#0B0D17" />
  <rect x="2" y="2" width="956" height="416" rx="20" fill="url(#st_dotGrid)" />
  <rect x="2" y="2" width="956" height="416" rx="20" stroke="url(#st_borderGrad)" stroke-width="1.2" />

  <!-- Card Header -->
  <g transform="translate(35, 30)">
    <text x="0" y="0" fill="#FF7A00" class="mono" font-size="12" font-weight="700" letter-spacing="1.5">// CHAKRA MATRIX // ARSENAL OF JUTSU</text>
    <text x="0" y="22" fill="#F8FAFC" class="sans" font-size="20" font-weight="700">Orbiting Tech Universe &amp; Weaponry</text>
  </g>

  <!-- LEFT: 3 TILTED ELLIPTICAL ORBITS AROUND RASENGAN CORE -->
  <g transform="translate(230, 240)">
    <!-- Ambient Core Glow -->
    <circle cx="0" cy="0" r="140" fill="url(#st_coreGlow)" />

    <!-- ORBIT 1: Tilted -30 deg (Cyan - Frontend/Next.js) -->
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="190" ry="70" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4" fill="none" />
      <!-- Planet: TypeScript -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite" />
        <g transform="translate(190, 0)">
          <circle cx="0" cy="0" r="15" fill="#1E293B" stroke="#3178C6" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#38BDF8" class="mono" font-size="10" font-weight="700">TS</text>
        </g>
        <g transform="translate(-190, 0)">
          <circle cx="0" cy="0" r="15" fill="#1E293B" stroke="#000000" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" class="mono" font-size="9" font-weight="700">Next</text>
        </g>
      </g>
    </g>

    <!-- ORBIT 2: Tilted 30 deg (Orange - Python/AI Guardrails) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="180" ry="75" stroke="#FF7A00" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4" fill="none" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite" />
        <g transform="translate(180, 0)">
          <circle cx="0" cy="0" r="15" fill="#1E293B" stroke="#FF7A00" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#FF7A00" class="mono" font-size="10" font-weight="700">Py</text>
        </g>
        <g transform="translate(-180, 0)">
          <circle cx="0" cy="0" r="15" fill="#1E293B" stroke="#3ECF8E" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#3ECF8E" class="mono" font-size="8" font-weight="700">Supa</text>
        </g>
      </g>
    </g>

    <!-- ORBIT 3: Horizontal 90 deg (Purple - Docker/Cybersecurity) -->
    <g transform="rotate(85)">
      <ellipse cx="0" cy="0" rx="170" ry="60" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4" fill="none" />
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
        <g transform="translate(170, 0)">
          <circle cx="0" cy="0" r="15" fill="#1E293B" stroke="#2496ED" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#60A5FA" class="mono" font-size="8" font-weight="700">Dock</text>
        </g>
        <g transform="translate(-170, 0)">
          <circle cx="0" cy="0" r="15" fill="#1E293B" stroke="#F43F5E" stroke-width="2" />
          <text x="0" y="4" text-anchor="middle" fill="#FB7185" class="mono" font-size="8" font-weight="700">Sec</text>
        </g>
      </g>
    </g>

    <!-- CENTRAL RASENGAN / CHAKRA CORE -->
    <g class="st_core">
      <circle cx="0" cy="0" r="28" fill="#00F0FF" fill-opacity="0.8" />
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" />
      <!-- Konoha Leaf Emblem inside core -->
      <g transform="scale(0.04) translate(-256, -256)" fill="#FF7A00">
        <path d="M256,48C141.1,48,48,141.1,48,256s93.1,208,208,208s208-93.1,208-208S370.9,48,256,48z M256,424 c-92.6,0-168-75.4-168-168c0-44.5,17.3-85,45.7-115.1l32.5,32.5C148.6,192.5,138,223,138,256c0,65.1,52.9,118,118,118 s118-52.9,118-118c0-38.6-18.7-72.9-47.5-94.4l28.8-35.8C391.8,155.6,414,203.2,414,256C414,348.6,338.6,424,256,424z" />
      </g>
    </g>
  </g>

  <!-- RIGHT: GROUPED CHIP GRID (Sequential Glow) -->
  <g transform="translate(480, 80)">
    
    <!-- Group 1: Languages -->
    <g transform="translate(0, 0)">
      <rect width="440" height="66" rx="12" fill="#101524" class="st_cg1" />
      <text x="16" y="22" fill="#FF7A00" class="mono" font-size="11" font-weight="700">LANGUAGES (CHAKRA ROOTS)</text>
      <!-- Chips -->
      <g transform="translate(16, 32)">
        <!-- TypeScript -->
        <rect x="0" y="0" width="85" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#60A5FA" class="mono" font-size="10.5" font-weight="600">TypeScript</text>
        <!-- JavaScript -->
        <rect x="93" y="0" width="85" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#FACC15" class="mono" font-size="10.5" font-weight="600">JavaScript</text>
        <!-- Python -->
        <rect x="186" y="0" width="65" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#38BDF8" class="mono" font-size="10.5" font-weight="600">Python</text>
        <!-- SQL -->
        <rect x="259" y="0" width="48" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#A78BFA" class="mono" font-size="10.5" font-weight="600">SQL</text>
        <!-- HTML/CSS -->
        <rect x="315" y="0" width="75" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#F87171" class="mono" font-size="10.5" font-weight="600">HTML/CSS</text>
      </g>
    </g>

    <!-- Group 2: Frontend & UI -->
    <g transform="translate(0, 78)">
      <rect width="440" height="66" rx="12" fill="#101524" class="st_cg2" />
      <text x="16" y="22" fill="#22D3EE" class="mono" font-size="11" font-weight="700">FRONTEND &amp; UI (GEN-JUTSU)</text>
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="65" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#38BDF8" class="mono" font-size="10.5" font-weight="600">React 19</text>
        <rect x="73" y="0" width="70" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#F8FAFC" class="mono" font-size="10.5" font-weight="600">Next.js 15</text>
        <rect x="151" y="0" width="90" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#2DD4BF" class="mono" font-size="10.5" font-weight="600">Tailwind CSS</text>
        <rect x="249" y="0" width="50" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#A855F7" class="mono" font-size="10.5" font-weight="600">Vite</text>
        <rect x="307" y="0" width="80" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#E879F9" class="mono" font-size="10.5" font-weight="600">shadcn/ui</text>
      </g>
    </g>

    <!-- Group 3: Backend & Databases -->
    <g transform="translate(0, 156)">
      <rect width="440" height="66" rx="12" fill="#101524" class="st_cg3" />
      <text x="16" y="22" fill="#A855F7" class="mono" font-size="11" font-weight="700">BACKEND &amp; CLOUD (TAI-JUTSU)</text>
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="65" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#4ADE80" class="mono" font-size="10.5" font-weight="600">Node.js</text>
        <rect x="73" y="0" width="75" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#34D399" class="mono" font-size="10.5" font-weight="600">Supabase</text>
        <rect x="156" y="0" width="85" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#60A5FA" class="mono" font-size="10.5" font-weight="600">PostgreSQL</text>
        <rect x="249" y="0" width="60" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#F8FAFC" class="mono" font-size="10.5" font-weight="600">Express</text>
        <rect x="317" y="0" width="60" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#38BDF8" class="mono" font-size="10.5" font-weight="600">Docker</text>
      </g>
    </g>

    <!-- Group 4: AI & Security -->
    <g transform="translate(0, 234)">
      <rect width="440" height="66" rx="12" fill="#101524" class="st_cg4" />
      <text x="16" y="22" fill="#10B981" class="mono" font-size="11" font-weight="700">AI SAFETY &amp; GUARDS (SEAL JUTSU / FŪINJUTSU)</text>
      <g transform="translate(16, 32)">
        <rect x="0" y="0" width="105" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#34D399" class="mono" font-size="10.5" font-weight="600">LLM Guardrails</text>
        <rect x="113" y="0" width="95" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#FBBF24" class="mono" font-size="10.5" font-weight="600">ONNX Runtime</text>
        <rect x="216" y="0" width="100" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#F87171" class="mono" font-size="10.5" font-weight="600">Secret Scrubber</text>
        <rect x="324" y="0" width="70" height="24" rx="6" fill="#172036" stroke="#1E293B" stroke-width="1" />
        <text x="10" y="16" fill="#A78BFA" class="mono" font-size="10.5" font-weight="600">FastAPI</text>
      </g>
    </g>

  </g>
</svg>